name: Nightly

on:
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = 北京时间次日 02:00
  workflow_dispatch:

jobs:
  reproducible-build:
    name: Reproducible Build & Performance Budget
    runs-on: windows-2022   # 固定镜像（宪法第 18 条）
    steps:
      - name: Print runner image version（可复现性审计）
        run: |
          Write-Host "ImageOS: $env:ImageOS"
          Write-Host "ImageVersion: $env:ImageVersion"
        shell: pwsh

      - uses: actions/checkout@v5

      - name: Setup .NET SDK (10.0 LTS)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup vcpkg (manifest 锁版本)
        shell: pwsh
        run: |
          $vcpkgDir = 'C:/vcpkg'
          if (-not (Test-Path "$vcpkgDir/.git")) {
            git clone https://github.com/microsoft/vcpkg $vcpkgDir
            if ($LASTEXITCODE -ne 0) { throw "vcpkg clone 失败" }
          } else {
            git -C $vcpkgDir fetch --depth 1 origin c4d9956c0c10a4742840a5e7d93efa2e0015c865
            if ($LASTEXITCODE -ne 0) {
              git -C $vcpkgDir fetch origin master
              if ($LASTEXITCODE -ne 0) { throw "vcpkg fetch baseline 失败" }
            }
          }
          git -C $vcpkgDir checkout c4d9956c0c10a4742840a5e7d93efa2e0015c865 --force
          if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout baseline 失败" }
          if (-not (Test-Path "$vcpkgDir/vcpkg.exe")) {
            & $vcpkgDir/bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap 失败" }
          }
          Write-Host "vcpkg ready: $vcpkgDir @ c4d9956"

      # 注意：此门禁只有在确定性构建标志就绪后才会通过
      # （T003 /T094：禁时间戳、PDB 可复现 /Brepro、依赖锁定）。
      - name: Build A (identical flags)
        run: |
          cmake -B build-a -S . -DVCPKG_MANIFEST_MODE=ON -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build build-a --config Release --parallel
        shell: pwsh

      - name: Build B (identical flags)
        run: |
          cmake -B build-b -S . -DVCPKG_MANIFEST_MODE=ON -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build build-b --config Release --parallel
        shell: pwsh

      - name: Compare artifact hashes
        run: |
          $ha = (Get-ChildItem build-a\Release\* -File | Get-FileHash | Sort-Object Path | ForEach-Object { $_.Path + '=' + $_.Hash })
          $hb = (Get-ChildItem build-b\Release\* -File | Get-FileHash | Sort-Object Path | ForEach-Object { $_.Path + '=' + $_.Hash })
          if (($ha -join "`n") -ne ($hb -join "`n")) { throw "Reproducible build failed: artifacts differ between two identical builds" }
          Write-Host "Reproducible build OK"
        shell: pwsh

      - name: Performance budget (tick <= 5ms, memory < 512MB)
        run: build-a\Release\bench.exe --tick-budget 5 --mem-budget 512
        shell: pwsh
