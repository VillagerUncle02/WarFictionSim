name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release (Windows)
    runs-on: windows-2022   # 固定镜像，与 ci.yml 保持一致（宪法第 18 条）
    steps:
      - name: Print runner image version（可复现性审计）
        run: |
          Write-Host "ImageOS: $env:ImageOS"
          Write-Host "ImageVersion: $env:ImageVersion"
        shell: pwsh

      - uses: actions/checkout@v5

      - name: Setup .NET SDK (10.0 LTS)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup vcpkg (manifest 锁版本)
        shell: pwsh
        run: |
          $vcpkgDir = 'C:/vcpkg'
          if (-not (Test-Path "$vcpkgDir/.git")) {
            git clone https://github.com/microsoft/vcpkg $vcpkgDir
            if ($LASTEXITCODE -ne 0) { throw "vcpkg clone 失败" }
          } else {
            git -C $vcpkgDir fetch --depth 1 origin c4d9956c0c10a4742840a5e7d93efa2e0015c865
            if ($LASTEXITCODE -ne 0) {
              git -C $vcpkgDir fetch origin master
              if ($LASTEXITCODE -ne 0) { throw "vcpkg fetch baseline 失败" }
            }
          }
          git -C $vcpkgDir checkout c4d9956c0c10a4742840a5e7d93efa2e0015c865 --force
          if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout baseline 失败" }
          if (-not (Test-Path "$vcpkgDir/vcpkg.exe")) {
            & $vcpkgDir/bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap 失败" }
          }
          Write-Host "vcpkg ready: $vcpkgDir @ c4d9956"

      - name: Locate toolchain (clang-cl / ninja / CMake 3.31)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $addPath = @()
          foreach ($cand in @((Join-Path $vsPath 'VC\Tools\Llvm\x64\bin'), 'C:\Program Files\LLVM\bin')) {
            if (Test-Path $cand) { $addPath += $cand }
          }
          $ninjaDir = Join-Path $vsPath 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
          if (Test-Path $ninjaDir) { $addPath += $ninjaDir }
          if ($addPath.Count -eq 0) { throw 'clang-cl 未找到（VS C++ Clang 工具组件缺失）' }
          "PATH=$($addPath -join ';');$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $vsCmake = Join-Path $vsPath 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
          if (Test-Path $vsCmake) {
            "CMAKE_BIN=$vsCmake" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "CMAKE_BIN=cmake" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          "VCPKG_ROOT=C:/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure & build native (clang-cl Release)
        shell: pwsh
        working-directory: native
        run: |
          & $env:CMAKE_BIN --preset clang-cl-release
          if ($LASTEXITCODE -ne 0) { throw "CMake 配置失败" }
          & $env:CMAKE_BIN --build --preset clang-cl-release
          if ($LASTEXITCODE -ne 0) { throw "C++ 构建失败" }

      - name: Publish C# app
        shell: pwsh
        run: |
          dotnet publish app/ui/src/WarFictionSim.Ui -c Release -o publish/
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish 失败" }

      - name: Package Windows build
        shell: pwsh
        run: |
          $native = 'native/build/clang-cl-release'
          if (Test-Path $native) {
            Compress-Archive -Path "$native\**", 'publish\*' -DestinationPath wfs-windows.zip -Force
          } else {
            Compress-Archive -Path 'publish\*' -DestinationPath wfs-windows.zip -Force
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} wfs-windows.zip --title "WarFictionSim ${{ github.ref_name }}" --generate-notes
        shell: pwsh
