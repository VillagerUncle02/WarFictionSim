name: CI

on:
  push:
    paths:
      - 'native/**'
      - 'app/**'
      - 'contracts/**'
      - 'data/**'
      - 'Directory.Build.*'
      - '.github/workflows/*.yml'
      - '.clang-format'
      - '.editorconfig'
  pull_request:
    paths:
      - 'native/**'
      - 'app/**'
      - 'contracts/**'
      - 'data/**'
      - 'Directory.Build.*'
      - '.github/workflows/*.yml'
      - '.clang-format'
      - '.editorconfig'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-pr-order:
    name: 前序 PR 已合并检查（链式队列）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: 运行前序 PR 顺序检查
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 默认忽略前序 PR 已合并检查（链式多 PR 并行时不阻断后续 PR CI）；
          # 如需强制按序合并，移除 -IgnoreOrder。
          ./scripts/check-pr-order.ps1 -Repo ${{ github.repository }} -PRNumber ${{ github.event.pull_request.number }} -IgnoreOrder

  native-build:
    name: Native C/C++ (Ninja + clang-cl)
    runs-on: windows-2022   # 固定镜像而非 windows-latest：latest 会滚动升级导致构建环境漂移
    steps:
      - name: Print runner image version（可复现性审计）
        run: |
          Write-Host "ImageOS: $env:ImageOS"
          Write-Host "ImageVersion: $env:ImageVersion"
        shell: pwsh

      - uses: actions/checkout@v5

      # 固定 vcpkg 到 vcpkg.json builtin-baseline 对应提交（宪法第 18 条）
      - name: Setup vcpkg (manifest 锁版本)
        shell: pwsh
        run: |
          $vcpkgDir = 'C:/vcpkg'
          if (-not (Test-Path "$vcpkgDir/.git")) {
            git clone https://github.com/microsoft/vcpkg $vcpkgDir
            if ($LASTEXITCODE -ne 0) { throw "vcpkg clone 失败" }
          } else {
            git -C $vcpkgDir fetch --depth 1 origin c4d9956c0c10a4742840a5e7d93efa2e0015c865
            if ($LASTEXITCODE -ne 0) {
              git -C $vcpkgDir fetch origin master
              if ($LASTEXITCODE -ne 0) { throw "vcpkg fetch baseline 失败" }
            }
          }
          git -C $vcpkgDir checkout c4d9956c0c10a4742840a5e7d93efa2e0015c865 --force
          if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout baseline 失败" }
          if (-not (Test-Path "$vcpkgDir/vcpkg.exe")) {
            & $vcpkgDir/bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap 失败" }
          }
          Write-Host "vcpkg ready: $vcpkgDir @ c4d9956"

      - name: Locate toolchain (clang-cl / ninja / CMake 3.31)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $addPath = @()
          foreach ($cand in @((Join-Path $vsPath 'VC\Tools\Llvm\x64\bin'), 'C:\Program Files\LLVM\bin')) {
            if (Test-Path $cand) { $addPath += $cand }
          }
          $ninjaDir = Join-Path $vsPath 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
          if (Test-Path $ninjaDir) { $addPath += $ninjaDir }
          if ($addPath.Count -eq 0) { throw 'clang-cl 未找到（VS C++ Clang 工具组件缺失）' }
          "PATH=$($addPath -join ';');$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $vsCmake = Join-Path $vsPath 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
          if (Test-Path $vsCmake) {
            $cmakeDir = Split-Path $vsCmake
            "CMAKE_BIN=$vsCmake" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "CTEST_BIN=$cmakeDir\ctest.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "CMAKE_BIN=cmake" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "CTEST_BIN=ctest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          "VCPKG_ROOT=C:/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure CMake (clang-cl Release)
        shell: pwsh
        working-directory: native
        run: |
          & $env:CMAKE_BIN --preset clang-cl-release
          if ($LASTEXITCODE -ne 0) { throw "CMake 配置失败" }

      - name: Build C++ core & C11 math lib (Release)
        shell: pwsh
        working-directory: native
        run: |
          & $env:CMAKE_BIN --build --preset clang-cl-release
          if ($LASTEXITCODE -ne 0) { throw "C++ 构建失败" }

      - name: Run C++ unit + golden tests (CTest)
        shell: pwsh
        working-directory: native
        run: |
          & $env:CTEST_BIN --preset clang-cl-release
          if ($LASTEXITCODE -ne 0) { throw "CTest 失败" }

      - name: Headless golden determinism (1 vs 4 threads)
        shell: pwsh
        run: |
          $exe = 'native/build/clang-cl-release/sim/sim_headless.exe'
          if ((Test-Path $exe) -and (Test-Path data/scenarios/scn-battalion-v1.json)) {
            $h1 = & $exe run --scenario data/scenarios/scn-battalion-v1.json --seed 42 --threads 1 --hash
            $h4 = & $exe run --scenario data/scenarios/scn-battalion-v1.json --seed 42 --threads 4 --hash
            if ($h1 -ne $h4) { throw "Thread determinism broken: $h1 != $h4" }
            Write-Host "Thread determinism OK: $h1"
          } else {
            Write-Host "跳过无头确定性验证（sim_headless 或剧本尚未实现）"
          }

      - name: Headless integration (script AI full run + save roundtrip)
        shell: pwsh
        run: |
          $exe = 'native/build/clang-cl-release/sim/sim_headless.exe'
          if ((Test-Path $exe) -and (Test-Path data/scenarios/scn-battalion-v1.json)) {
            & $exe run --scenario data/scenarios/scn-battalion-v1.json --seed 42 --ai-backend script --out full.jsonl
            & $exe save --scenario data/scenarios/scn-battalion-v1.json --seed 42 --out save.wfs
            & $exe load-save --path save.wfs --verify-hash
          } else {
            Write-Host "跳过无头集成验证（sim_headless 或剧本尚未实现）"
          }

      - name: Lint & style checks（C/C++）
        shell: pwsh
        run: |
          $cppAll = @(Get-ChildItem native/sim,native/core_c -Recurse -Include *.cpp,*.h,*.c -ErrorAction SilentlyContinue | ForEach-Object FullName)
          if ($cppAll.Count -gt 0) {
            clang-format --dry-run --Werror $cppAll
            if ($LASTEXITCODE -ne 0) { throw "clang-format 发现格式问题" }
          } else {
            Write-Host "暂无 C++ 源码，跳过 clang-format"
          }
          if (Get-Command clang-tidy -ErrorAction SilentlyContinue) {
            $repoRoot = (Get-Location).Path
            # Windows 路径需转正斜杠并转义正则元字符，否则 \a/\W 等会被当作
            # 正则转义，header-filter 失效导致 clang-tidy 全量分析系统头（海量噪音）。
            $repoRootFwd = $repoRoot -replace '\\', '/'
            $headerFilter = [regex]::Escape($repoRootFwd) + '/(native/sim|native/core_c)/'
            $cppSrc = @(Get-ChildItem native/sim -Recurse -Include *.cpp,*.cc,*.cxx -ErrorAction SilentlyContinue | ForEach-Object FullName)
            $cSrc = @(Get-ChildItem native/core_c -Recurse -Include *.c -ErrorAction SilentlyContinue | ForEach-Object FullName)
            # Ninja + clang-cl 已产出 compile_commands.json：直接按编译数据库分析
            if ($cppSrc.Count -gt 0) {
              clang-tidy $cppSrc -p native/build/clang-cl-release --checks=-*,clang-analyzer-*,bugprone-*,performance-*,readability-* --header-filter="$headerFilter" --quiet
              if ($LASTEXITCODE -ne 0) { throw "clang-tidy 发现代码问题" }
            }
            if ($cSrc.Count -gt 0) {
              clang-tidy $cSrc -p native/build/clang-cl-release --checks=-*,clang-analyzer-*,bugprone-*,performance-*,readability-* --header-filter="$headerFilter" --quiet
              if ($LASTEXITCODE -ne 0) { throw "clang-tidy 发现代码问题" }
            }
            if ($cppSrc.Count -eq 0 -and $cSrc.Count -eq 0) {
              Write-Host "暂无 C/C++ 源码，跳过 clang-tidy"
            }
          } else {
            Write-Host "clang-tidy 不可用，跳过"
          }

      - name: Upload native build artifacts
        shell: pwsh
        run: |
          New-Item -ItemType File -Path 'native/build/clang-cl-release/.wfs-artifact' -Force | Out-Null
        # 标记文件保证骨架期（无 DLL/exe）也能生成 artifact，app job 下载不失败
      - uses: actions/upload-artifact@v7
        with:
          name: wfs-native-build
          path: |
            native/build/clang-cl-release/.wfs-artifact
            native/build/clang-cl-release/**/*.dll
            native/build/clang-cl-release/**/*.exe
          if-no-files-found: warn

  app-build:
    name: App C# (dotnet)
    needs: native-build
    runs-on: windows-2022
    steps:
      - name: Print runner image version（可复现性审计）
        run: |
          Write-Host "ImageOS: $env:ImageOS"
          Write-Host "ImageVersion: $env:ImageVersion"
        shell: pwsh

      - uses: actions/checkout@v5

      - name: Setup .NET SDK (10.0 LTS)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download native artifacts
        uses: actions/download-artifact@v7
        with:
          name: wfs-native-build
          path: native/build/clang-cl-release

      - name: Build C# UI & tools
        shell: pwsh
        run: |
          dotnet build app/WarFictionSim.sln -c Release
          if ($LASTEXITCODE -ne 0) { throw "dotnet 构建失败" }

      - name: Run C# tests (xUnit)
        shell: pwsh
        run: |
          dotnet test app/WarFictionSim.sln -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "dotnet 测试失败" }

      - name: Data schema validation
        shell: pwsh
        run: |
          if (Test-Path app/tools/src/DataValidator) {
            dotnet run --project app/tools/src/DataValidator -- data/ --all
            if ($LASTEXITCODE -ne 0) { throw "数据校验失败" }
          } else {
            Write-Host "跳过数据校验（DataValidator 尚未实现）"
          }

      - name: C# lint（dotnet format）
        shell: pwsh
        run: |
          dotnet format style app/WarFictionSim.sln --verify-no-changes
          if ($LASTEXITCODE -ne 0) { throw "dotnet format style 失败" }
          dotnet format analyzers app/WarFictionSim.sln --verify-no-changes
          if ($LASTEXITCODE -ne 0) { throw "dotnet format analyzers 失败" }

      - name: Upload CI artifacts
        if: hashFiles('app/**/bin/Release/**', 'native/build/clang-cl-release/**/*.dll') != ''
        uses: actions/upload-artifact@v7
        with:
          name: wfs-windows-ci
          path: |
            app/ui/src/WarFictionSim.Ui/bin/Release/
            app/tools/src/WarFictionSim.Tools/bin/Release/
            native/build/clang-cl-release/**/*.dll
          if-no-files-found: warn
