name: CI

on:
  push:
    paths:
      - 'sim/**'
      - 'core_c/**'
      - 'ui/**'
      - 'tools/**'
      - 'tests/**'
      - 'data/**'
      - 'contracts/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '*.sln'
      - 'Directory.Build.*'
      - '.github/workflows/ci.yml'
      - '.clang-format'
      - '.editorconfig'
  pull_request:
    paths:
      - 'sim/**'
      - 'core_c/**'
      - 'ui/**'
      - 'tools/**'
      - 'tests/**'
      - 'data/**'
      - 'contracts/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '*.sln'
      - 'Directory.Build.*'
      - '.github/workflows/ci.yml'
      - '.clang-format'
      - '.editorconfig'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Windows)
    # 固定镜像而非 windows-latest：latest 会滚动升级导致构建环境漂移，
    # 破坏"同一提交产生相同产物"（宪法第 18 条）。如需新镜像可显式升级到 windows-2025。
    runs-on: windows-2022
    steps:
      - name: Print runner image version（可复现性审计）
        run: |
          Write-Host "ImageOS: $env:ImageOS"
          Write-Host "ImageVersion: $env:ImageVersion"
        shell: pwsh

      - uses: actions/checkout@v4

      - name: Setup .NET SDK (10.0 LTS)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # 锁大版本；如需要更强稳定可改为精确 build 号

      # 固定 vcpkg 到 vcpkg.json builtin-baseline 对应提交（宪法第 18 条）：
      # 部分克隆（blob:none）避免浅克隆导致 baseline 提交缺失。
      - name: Setup vcpkg (manifest 锁版本)
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:/vcpkg/scripts/buildsystems/vcpkg.cmake')) {
            # 完整克隆 + 检出 baseline：部分克隆的按需取 blob 在 runner 上不可靠，
            # 会导致 git show <baseline>:versions/baseline.json 失败。
            git clone https://github.com/microsoft/vcpkg C:/vcpkg
            if ($LASTEXITCODE -ne 0) { throw "vcpkg clone 失败" }
            git -C C:/vcpkg checkout c4d9956c0c10a4742840a5e7d93efa2e0015c865
            if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout baseline 失败" }
            & C:/vcpkg/bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap 失败" }
          }
          Write-Host "vcpkg ready: C:/vcpkg"

      - name: Configure CMake (vcpkg manifest 锁版本)
        shell: pwsh
        run: |
          if (Test-Path CMakeLists.txt) {
            cmake -B build -S . -DVCPKG_MANIFEST_MODE=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
            if ($LASTEXITCODE -ne 0) { throw "CMake 配置失败" }
          } else {
            Write-Host "跳过 CMake 配置（无 CMakeLists.txt）"
          }

      - name: Build C++ core & C11 math lib (Release)
        shell: pwsh
        run: |
          if (Test-Path build/CMakeCache.txt) {
            cmake --build build --config Release --parallel
            if ($LASTEXITCODE -ne 0) { throw "C++ 构建失败" }
          } else {
            Write-Host "跳过 C++ 构建（尚未配置）"
          }

      - name: Run C++ unit + golden tests (CTest)
        shell: pwsh
        run: |
          if (Test-Path build) {
            ctest --test-dir build -C Release --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "CTest 失败" }
          } else {
            Write-Host "跳过 CTest（尚未配置）"
          }

      - name: Build C# UI & tools
        shell: pwsh
        run: |
          if (Test-Path WarFictionSim.sln) {
            dotnet build WarFictionSim.sln -c Release
            if ($LASTEXITCODE -ne 0) { throw "dotnet 构建失败" }
          } else {
            Write-Host "跳过 dotnet 构建（无解决方案）"
          }

      - name: Run C# tests (xUnit)
        shell: pwsh
        run: |
          if (Test-Path WarFictionSim.sln) {
            dotnet test WarFictionSim.sln -c Release --no-build
            if ($LASTEXITCODE -ne 0) { throw "dotnet 测试失败" }
          } else {
            Write-Host "跳过 dotnet 测试"
          }

      # 云端 AI 不进 CI：测试一律用无 AI 脚本模式（确定性），
      # 云端后端集成由本地/手动验证，避免密钥与不确定性进入流水线。
      - name: Headless golden determinism (1 vs 4 threads)
        shell: pwsh
        run: |
          if ((Test-Path build\Release\sim_headless.exe) -and (Test-Path data/scenarios/scn-battalion-v1.json)) {
            $h1 = & build\Release\sim_headless.exe run --scenario data/scenarios/scn-battalion-v1.json --seed 42 --threads 1 --hash
            $h4 = & build\Release\sim_headless.exe run --scenario data/scenarios/scn-battalion-v1.json --seed 42 --threads 4 --hash
            if ($h1 -ne $h4) { throw "Thread determinism broken: $h1 != $h4" }
            Write-Host "Thread determinism OK: $h1"
          } else {
            Write-Host "跳过无头确定性验证（sim_headless 或剧本尚未实现）"
          }

      - name: Headless integration (script AI full run + save roundtrip)
        shell: pwsh
        run: |
          if ((Test-Path build\Release\sim_headless.exe) -and (Test-Path data/scenarios/scn-battalion-v1.json)) {
            & build\Release\sim_headless.exe run --scenario data/scenarios/scn-battalion-v1.json --seed 42 --ai-backend script --out full.jsonl
            & build\Release\sim_headless.exe save --scenario data/scenarios/scn-battalion-v1.json --seed 42 --out save.wfs
            & build\Release\sim_headless.exe load-save --path save.wfs --verify-hash
          } else {
            Write-Host "跳过无头集成验证（sim_headless 或剧本尚未实现）"
          }

      - name: Lint & style checks（宪法代码风格）
        shell: pwsh
        run: |
          # C++：先收集源码列表；为空时跳过（避免 clang-format 无参数从 stdin 挂起）
          $cppAll = @(Get-ChildItem sim,core_c -Recurse -Include *.cpp,*.h,*.c -ErrorAction SilentlyContinue | ForEach-Object FullName)
          if ($cppAll.Count -gt 0) {
            # clang-format 强制风格（.clang-format 为唯一风格来源）
            clang-format --dry-run --Werror $cppAll
            if ($LASTEXITCODE -ne 0) { throw "clang-format 发现格式问题" }
          } else {
            Write-Host "暂无 C++ 源码，跳过 clang-format"
          }
          # C++：clang-tidy 静态分析（bugprone/performance/readability/clang-analyzer）
          if (Get-Command clang-tidy -ErrorAction SilentlyContinue) {
            if ($cppAll.Count -gt 0) {
              clang-tidy -p build $cppAll --checks=-*,clang-analyzer-*,bugprone-*,performance-*,readability-* --quiet
              if ($LASTEXITCODE -ne 0) { throw "clang-tidy 发现代码问题" }
            } else {
              Write-Host "暂无 C++ 源码，跳过 clang-tidy"
            }
          } else {
            Write-Host "clang-tidy 不可用，跳过（保留 clang-format 强制风格）"
          }
          # C#：dotnet format 强制风格 + .NET 分析器
          if (Test-Path WarFictionSim.sln) {
            dotnet format style WarFictionSim.sln --verify-no-changes
            if ($LASTEXITCODE -ne 0) { throw "dotnet format style 失败" }
            dotnet format analyzers WarFictionSim.sln --verify-no-changes
            if ($LASTEXITCODE -ne 0) { throw "dotnet format analyzers 失败" }
          } else {
            Write-Host "跳过 dotnet format（无解决方案）"
          }

      - name: Data schema validation
        shell: pwsh
        run: |
          if (Test-Path tools/src/DataValidator) {
            dotnet run --project tools/src/DataValidator -- data/ --all
            if ($LASTEXITCODE -ne 0) { throw "数据校验失败" }
          } else {
            Write-Host "跳过数据校验（DataValidator 尚未实现）"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wfs-windows-ci
          path: |
            build/Release/
            ui/bin/Release/
          if-no-files-found: warn
